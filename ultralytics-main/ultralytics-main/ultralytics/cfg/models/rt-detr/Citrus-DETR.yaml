# Ultralytics RT-DETR-l hybrid object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/rtdetr
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=rtdetr-l.yaml' will call rtdetr-l.yaml with scale 'l'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 1, SFPC_Block, [128]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 1, SFPC_Block, [256]]
  - [-1, 1, Conv, [384, 3, 2]]  # 5-P4/16
  - [-1, 1, SFPC_Block, [384]]
  - [-1, 1, Conv, [384, 3, 2]]  # 7-P5/32
  - [-1, 3, SFPC_Block, [384]]

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9 input_proj.2
  - [-1, 1, SAFE, [1024]] # 10
  - [-1, 1, Conv, [256, 1, 1]]  # 11, Y5, lateral_convs.0

  - [-1, 1, SWU, [2]] # 12
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 13 input_proj.1
  - [[-2, -1], 1, ACF, [256]] # 14
  - [-1, 3, GCEC3, [256, 0.5]]  # 15, fpn_blocks.0
  - [-1, 1, Conv, [128, 1, 1]]   # 16, Y4, lateral_convs.1

  - [-1, 1, SWU, [2]] # 17
  - [2, 1, ETSD, [128]] # 18
  - [[-1, -2, 3], 1, ACF, [256]] # 19
  - [-1, 1, CSPOmniKernel, []] # 20
  - [-1, 3, GCEC3, [256, 0.5]]  # 21, fpn_blocks.0

  - [-1, 1, ETSD, [256, 3, 2]] # 22
  - [[-1, 16], 1, ACF, [256]] # 23
  - [-1, 3, GCEC3, [256, 0.5]]  # 24, fpn_blocks.0

  - [-1, 1, ETSD, [256, 3, 2]] # 25
  - [[-1, 11], 1, ACF, [256]] # 26
  - [-1, 3, GCEC3, [256, 0.5]]  # 27, fpn_blocks.0

  - [[21, 24, 27], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # RTDETRDecoder(P3, P4, P5)